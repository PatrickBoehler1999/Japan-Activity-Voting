  let quickMode = false;
  let shuffleMode = false;
  let view = 'hub'; // 'hub' | 'browse'
  const quickHistory = []; // { slug, prev } stack for undo in quick sort mode

  const typeCode = {
    'Temples & Shrines':'TMP',
    'Sightseeing':'SGT',
    'Activities':'ACT',
    'Cafes & Bakeries':'CAF',
    'Noodles & Comfort Food':'NDL',
    'Restaurants':'RST',
    'Street Food & Markets':'MKT',
    'Izakaya, Grills & Sushi':'IZK',
    'International & Casual':'INT',
    'Nightlife':'NGT',
    'Shopping':'SHP',
    'Nature':'NAT',
    'Day Trips':'DAY'
  };
  const categoryOrder = Object.keys(typeCode);
  function categoryCode(type){ return typeCode[type] || type.slice(0,3).toUpperCase(); }

  let currentVoter = null;
  const votes = {}; // slug -> 'yes' | 'indifferent' | 'no'  (unset until voter picks)

  // ---- Auto-save progress to localStorage ----
  // Note: localStorage is unavailable inside Claude.ai's sandboxed artifact preview
  // (that sandbox blocks all browser storage). This works normally once the file is
  // opened directly (e.g. via Safari/file://) or hosted for real on GitHub Pages —
  // saveProgress/loadProgress fail silently rather than erroring if storage is blocked.
  const STORAGE_PREFIX = 'japan-vote-demo:';

  function saveProgress(){
    if (!currentVoter) return;
    try {
      localStorage.setItem(STORAGE_PREFIX + currentVoter, JSON.stringify(votes));
    } catch (e) { /* storage unavailable — continue silently, in-memory state still works */ }
  }

  function loadProgress(voterId){
    try {
      const raw = localStorage.getItem(STORAGE_PREFIX + voterId);
      if (!raw) return false;
      const saved = JSON.parse(raw);
      Object.keys(votes).forEach(k => delete votes[k]);
      Object.assign(votes, saved);
      return Object.keys(saved).length > 0;
    } catch (e) {
      return false;
    }
  }

  function firstUnfinishedCategory(){
    for (const type of categoryOrder){
      const items = activities.filter(a => a.type === type);
      if (!items.every(a => votes[a.slug])) return type;
    }
    return categoryOrder[categoryOrder.length - 1];
  }

  const voterGate = document.getElementById('voterGate');
  const gateGrid = document.getElementById('gateGrid');
  const gateConfirmBtn = document.getElementById('gateConfirmBtn');
  const hubSection = document.getElementById('hubSection');
  const browseSection = document.getElementById('browseSection');
  const backToHubBtn = document.getElementById('backToHubBtn');
  const ticketList = document.getElementById('ticketList');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const voterLabel = document.getElementById('voterLabel');
  const exportBtn = document.getElementById('exportBtn');
  const exportStatus = document.getElementById('exportStatus');
  const hideVotedInput = document.getElementById('hideVotedInput');
  const quickModeInput = document.getElementById('quickModeInput');
  const shuffleInput = document.getElementById('shuffleInput');
  const quickCard = document.getElementById('quickCard');

  let gateSelection = null;

  function renderGate(){
    gateGrid.innerHTML = '';
    crew.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'gate-name-btn' + (gateSelection === p.id ? ' selected' : '');
      btn.style.setProperty('--chip-color', p.color);
      btn.textContent = p.name;
      btn.onclick = () => {
        gateSelection = p.id;
        gateConfirmBtn.disabled = false;
        renderGate();
      };
      gateGrid.appendChild(btn);
    });
  }

  gateConfirmBtn.onclick = () => {
    if (!gateSelection) return;
    const p = crew.find(c => c.id === gateSelection);
    selectVoter(p);
    voterGate.style.display = 'none';
    document.body.style.overflow = '';
  };

  function selectVoter(p){
    currentVoter = p.id;
    document.documentElement.style.setProperty('--voter', p.color);
    voterLabel.textContent = p.name;
    const resumed = loadProgress(p.id);
    exportStatus.textContent = p.name + (resumed ? ' — resuming your progress' : ' — sorting by category');
    exportBtn.disabled = false;
    enterCategory(firstUnfinishedCategory());
  }

  function renderHub(){
    view = 'hub';
    hubSection.style.display = '';
    browseSection.style.display = 'none';

    const totalVoted = activities.filter(a => votes[a.slug]).length;
    const categoryCards = categoryOrder.map(type => {
      const items = activities.filter(a => a.type === type);
      const voted = items.filter(a => votes[a.slug]).length;
      return `
        <button class="hub-card" data-type="${type}">
          <div class="hub-card-code">${categoryCode(type)}</div>
          <div class="hub-card-name">${type}</div>
          <div class="hub-card-count">${voted} / ${items.length} voted</div>
        </button>`;
    }).join('');

    hubSection.innerHTML = `
      <div class="hub-intro">
        <div class="hub-overall">${totalVoted} / ${activities.length} voted overall</div>
        <p class="hub-sub">Pick a category to compare like with like — go through all the temples together, then all the restaurants, and so on.</p>
      </div>
      <div class="hub-grid">
        ${categoryCards}
        <button class="hub-card hub-card-all" data-type="All">
          <div class="hub-card-code">ALL</div>
          <div class="hub-card-name">Everything</div>
          <div class="hub-card-count">${totalVoted} / ${activities.length} voted</div>
        </button>
      </div>
    `;

    hubSection.querySelectorAll('.hub-card').forEach(btn => {
      btn.onclick = () => enterCategory(btn.dataset.type);
    });
  }

  function enterCategory(type){
    currentFilter = type;
    quickMode = true;
    quickModeInput.checked = true;
    view = 'browse';
    hubSection.style.display = 'none';
    browseSection.style.display = '';
    renderTickets();
  }

  backToHubBtn.onclick = () => renderHub();

  function renderTickets(){
    if (quickMode){
      ticketList.innerHTML = '';
      ticketList.style.display = 'none';
      quickCard.style.display = '';
      renderQuickCard();
      updateProgress();
      return;
    }
    ticketList.style.display = '';
    quickCard.style.display = 'none';
    quickCard.innerHTML = '';

    ticketList.innerHTML = '';

    const visible = activities.filter(a => {
      const matchesFilter = currentFilter === 'All' || a.type === currentFilter;
      const matchesHide = !hideVoted || !votes[a.slug];
      return matchesFilter && matchesHide;
    });

    visible.forEach(act => {
      const card = document.createElement('div');
      card.className = 'ticket' + (expandedSlug === act.slug ? ' expanded' : '');
      card.innerHTML = `
        <div class="ticket-stub">
          <div class="stub-code">${cityCode[act.city]}</div>
          <div class="stub-city">${act.city}</div>
        </div>
        <div class="ticket-body">
          <div class="ticket-head" data-toggle="${act.slug}">
            <div>
              <div class="ticket-name">${act.name}</div>
              <div class="ticket-tag">${act.type}</div>
            </div>
            <span class="ticket-chevron">▾</span>
          </div>
          <div class="ticket-desc"><div class="ticket-desc-inner">${act.desc}</div></div>
          <div class="vote-row">
            <button class="vote-btn" data-val="yes" data-slug="${act.slug}"><span class="mark">●</span>Yes<span class="stamp-pop"></span></button>
            <button class="vote-btn" data-val="indifferent" data-slug="${act.slug}"><span class="mark">〜</span>Meh<span class="stamp-pop"></span></button>
            <button class="vote-btn" data-val="no" data-slug="${act.slug}"><span class="mark">✕</span>No<span class="stamp-pop"></span></button>
          </div>
        </div>
      `;
      ticketList.appendChild(card);
    });

    // wire expand/collapse
    document.querySelectorAll('.ticket-head').forEach(head => {
      head.onclick = () => {
        const slug = head.dataset.toggle;
        expandedSlug = expandedSlug === slug ? null : slug;
        renderTickets();
      };
    });

    // wire vote buttons + reflect state
    document.querySelectorAll('.vote-btn').forEach(btn => {
      const slug = btn.dataset.slug;
      const val = btn.dataset.val;
      if (votes[slug] === val) btn.classList.add('active');
      btn.onclick = () => castVote(slug, val, btn);
    });

    updateProgress();
  }

  function castVote(slug, val, btn){
    if (!currentVoter) return;
    votes[slug] = val;
    saveProgress();

    // update sibling buttons in this ticket
    const row = btn.parentElement;
    row.querySelectorAll('.vote-btn').forEach(b => b.classList.remove('active', 'just-stamped'));
    btn.classList.add('active', 'just-stamped');
    requestAnimationFrame(() => {
      setTimeout(() => btn.classList.remove('just-stamped'), 350);
    });

    updateProgress();

    if (hideVoted){
      const card = btn.closest('.ticket');
      if (card){
        setTimeout(() => {
          card.classList.add('leaving');
          setTimeout(() => renderTickets(), 350);
        }, 300);
      }
    }
  }

  function updateProgress(){
    const voted = activities.filter(a => votes[a.slug]).length;
    progressLabel.textContent = `${voted} / ${activities.length} stamped`;
    progressFill.style.width = (voted / activities.length * 100) + '%';
  }

  exportBtn.onclick = () => {
    if (!currentVoter) return;
    const payload = {
      voter: currentVoter,
      exportedAt: new Date().toISOString(),
      votes: {}
    };
    activities.forEach(a => {
      payload.votes[a.slug] = votes[a.slug] || 'indifferent';
    });
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `votes-${currentVoter}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const badgeByType = {
    'Temples & Shrines': 'The Pilgrim',
    'Sightseeing': 'The Sightseer',
    'Activities': 'The Player',
    'Cafes & Bakeries': 'The Cafe Hopper',
    'Noodles & Comfort Food': 'The Noodle Hunter',
    'Restaurants': 'The Foodie',
    'Street Food & Markets': 'The Grazer',
    'Izakaya, Grills & Sushi': 'The Izakaya Regular',
    'International & Casual': 'The Easy Eater',
    'Nightlife': 'The Night Owl',
    'Shopping': 'The Shopper',
    'Nature': 'The Wanderer',
    'Day Trips': 'The Explorer'
  };

  function computeFinalStats(){
    const tally = { yes: 0, indifferent: 0, no: 0 };
    const cityYes = {};
    const typeYes = {};

    activities.forEach(a => {
      const v = votes[a.slug] || 'indifferent';
      tally[v]++;
      if (v === 'yes'){
        cityYes[a.city] = (cityYes[a.city] || 0) + 1;
        typeYes[a.type] = (typeYes[a.type] || 0) + 1;
      }
    });

    let topType = null, topTypeCount = 0;
    Object.entries(typeYes).forEach(([t, c]) => { if (c > topTypeCount){ topType = t; topTypeCount = c; } });

    let topCity = null, topCityCount = 0;
    Object.entries(cityYes).forEach(([c, n]) => { if (n > topCityCount){ topCity = c; topCityCount = n; } });

    const yesPct = Math.round((tally.yes / activities.length) * 100);
    const badge = topType ? (badgeByType[topType] || 'The Traveler') : 'The Undecided';

    return {
      tally, yesPct, topType, topTypeCount,
      topCity: topCity ? topCity.charAt(0).toUpperCase() + topCity.slice(1) : null,
      badge
    };
  }

  function shuffleArray(arr){
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function renderQuickCard(){
    let pool = activities.filter(a =>
      (currentFilter === 'All' || a.type === currentFilter) && !votes[a.slug]
    );
    if (shuffleMode) pool = shuffleArray(pool);

    if (pool.length === 0){
      const allDone = activities.every(a => votes[a.slug]);

      if (allDone){
        const stats = computeFinalStats();
        const typeLine = stats.topType
          ? `<div class="quick-next">Top category: <strong>${stats.topType}</strong> (${stats.topTypeCount} yes)</div>`
          : '';
        const cityLine = stats.topCity
          ? `<div class="quick-next">Favorite city: <strong>${stats.topCity}</strong></div>`
          : '';

        quickCard.innerHTML = `
          <div class="quick-card">
            <div class="quick-empty">All activities voted — nice work!</div>
            <div class="quick-badge">You're ${stats.badge}</div>
            <div class="quick-tally">
              <span class="tally-yes">${stats.tally.yes} yes</span> ·
              <span class="tally-indifferent">${stats.tally.indifferent} indifferent</span> ·
              <span class="tally-no">${stats.tally.no} no</span>
            </div>
            <div class="quick-stat-line">Said yes to ${stats.yesPct}% of everything</div>
            ${typeLine}
            ${cityLine}
            <div class="quick-next">Hit Export My Votes below to send in your picks.</div>
            <button class="quick-undo" id="quickUndoBtn" ${quickHistory.length === 0 ? 'disabled' : ''}>↶ Undo last vote</button>
          </div>`;
        wireQuickUndo();
        return;
      }

      const scope = activities.filter(a => currentFilter === 'All' || a.type === currentFilter);
      const tally = { yes: 0, indifferent: 0, no: 0 };
      scope.forEach(a => { const v = votes[a.slug]; if (v) tally[v]++; });

      const catIdx = categoryOrder.indexOf(currentFilter);
      let nextType = (catIdx !== -1 && catIdx < categoryOrder.length - 1) ? categoryOrder[catIdx + 1] : null;
      // skip any categories that are already fully voted, so Continue always lands on real unfinished work
      while (nextType && activities.filter(a => a.type === nextType).every(a => votes[a.slug])){
        const idx = categoryOrder.indexOf(nextType);
        nextType = idx < categoryOrder.length - 1 ? categoryOrder[idx + 1] : null;
      }

      const tallyHtml = `
        <div class="quick-tally">
          <span class="tally-yes">${tally.yes} yes</span> ·
          <span class="tally-indifferent">${tally.indifferent} indifferent</span> ·
          <span class="tally-no">${tally.no} no</span>
        </div>`;

      quickCard.innerHTML = `
        <div class="quick-card">
          <div class="quick-empty">Done with ${currentFilter}!</div>
          ${tallyHtml}
          <div class="quick-next">Next up: <strong>${nextType}</strong></div>
          <div class="quick-bulk-row">
            <button class="quick-continue-btn" id="quickContinueBtn">Continue to ${nextType} →</button>
          </div>
          <button class="quick-undo" id="quickUndoBtn" ${quickHistory.length === 0 ? 'disabled' : ''}>↶ Undo last vote</button>
        </div>`;
      const continueBtn = document.getElementById('quickContinueBtn');
      if (continueBtn) continueBtn.onclick = () => enterCategory(nextType);
      wireQuickUndo();
      return;
    }

    const act = pool[0];
    const remaining = pool.length;

    quickCard.innerHTML = `
      <div class="quick-card">
        <div class="quick-progress">${remaining} left in this filter</div>
        <div class="quick-eyebrow">${cityCode[act.city]} · ${act.city}</div>
        <div class="quick-name">${act.name}</div>
        <div class="quick-tag">${act.type}</div>
        <div class="quick-desc">${act.desc}</div>
        <div class="quick-vote-row">
          <button class="quick-vote-btn" data-val="yes"><span class="mark">●</span>Yes</button>
          <button class="quick-vote-btn" data-val="indifferent"><span class="mark">〜</span>Meh</button>
          <button class="quick-vote-btn" data-val="no"><span class="mark">✕</span>No</button>
        </div>
        <div class="quick-bulk-row">
          <button class="quick-bulk-btn" id="quickBulkBtn">Mark remaining ${remaining} indifferent</button>
        </div>
        <button class="quick-undo" id="quickUndoBtn" ${quickHistory.length === 0 ? 'disabled' : ''}>↶ Undo last vote</button>
      </div>
    `;

    quickCard.querySelectorAll('.quick-vote-btn').forEach(btn => {
      btn.onclick = () => castQuickVote(act.slug, btn.dataset.val);
    });
    wireQuickUndo();
    const bulkBtn = document.getElementById('quickBulkBtn');
    if (bulkBtn) bulkBtn.onclick = markRestIndifferent;
  }

  function markRestIndifferent(){
    if (!currentVoter) return;
    const pool = activities.filter(a =>
      (currentFilter === 'All' || a.type === currentFilter) && !votes[a.slug]
    );
    if (pool.length === 0) return;
    quickHistory.push({ bulk: pool.map(a => ({ slug: a.slug, prev: votes[a.slug] })) });
    pool.forEach(a => { votes[a.slug] = 'indifferent'; });
    saveProgress();
    updateProgress();
    renderQuickCard();
  }

  function wireQuickUndo(){
    const btn = document.getElementById('quickUndoBtn');
    if (btn) btn.onclick = undoLastQuickVote;
  }

  function undoLastQuickVote(){
    if (quickHistory.length === 0) return;
    const entry = quickHistory.pop();
    if (entry.bulk){
      entry.bulk.forEach(({ slug, prev }) => {
        if (prev === undefined) delete votes[slug]; else votes[slug] = prev;
      });
    } else {
      const { slug, prev } = entry;
      if (prev === undefined) delete votes[slug]; else votes[slug] = prev;
    }
    saveProgress();
    updateProgress();
    renderQuickCard();
  }

  function castQuickVote(slug, val){
    if (!currentVoter) return;
    quickHistory.push({ slug, prev: votes[slug] });
    votes[slug] = val;
    saveProgress();
    updateProgress();

    const card = quickCard.querySelector('.quick-card');
    if (card){
      card.classList.add('leaving');
      setTimeout(() => renderQuickCard(), 260);
    } else {
      renderQuickCard();
    }
  }

  quickModeInput.onchange = () => {
    quickMode = quickModeInput.checked;
    renderTickets();
  };

  shuffleInput.onchange = () => {
    shuffleMode = shuffleInput.checked;
    if (quickMode) renderQuickCard();
  };

  hideVotedInput.onchange = () => {
    hideVoted = hideVotedInput.checked;
    renderTickets();
  };

  document.body.style.overflow = 'hidden';
  renderGate();
  renderHub();
</script>

</body>
</html>
